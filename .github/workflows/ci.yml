# Tests the tooling this repository ships to every other one.
#
# `dep-check` is a detector, and a detector that cannot detect is worse than none: it reports
# green over the condition it was built to find, and the green is believed. Its suite pins the
# three peer ranges that actually shipped broken, plus the npm-versus-pnpm case that made the
# gate run `pnpm test` on an npm repository and call the failure a pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A cancelled run on main leaves the commit with no verdict, which reads the same as a
  # passing one. Only supersede elsewhere.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: dep-check suite (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The floor of `engines.node` and the current release. A tool every repository runs
        # has to work on the oldest Node any of them pins.
        node: ['22.12', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        working-directory: packages/dep-check
        run: npm ci --no-audit --no-fund

      - name: Test
        working-directory: packages/dep-check
        run: npm test

      - name: The published tarball must carry a working CLI # zizmor: ignore[adhoc-packages]
        # `files[]` decides what ships, and it is the one part of the manifest no unit test
        # touches. Installing the pack output into an empty project is the only way to find
        # out that a src/ directory was left out — after which the CLI is a stack trace.
        working-directory: packages/dep-check
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent)"
          scratch="$(mktemp -d)"
          cp "$tarball" "$scratch/"
          cd "$scratch"
          node -e 'require("fs").writeFileSync("package.json",JSON.stringify({name:"scratch",private:true,version:"1.0.0"}))'
          # The "package" is the tarball this step just packed from this repository. No lockfile
          # could cover it, and covering it would defeat the check: the point is to install
          # exactly what a consumer installs — which is why the suppression sits on the step
          # above rather than here. zizmor attributes a finding to the STEP, so a comment
          # inside the shell block is read by people and by nothing else.
          npm install --silent "./$tarball"
          npx --no-install dep-check --help | grep -q "manifest"
          npx --no-install dep-check --help | grep -q "run-command"

  setup-action:
    name: setup action (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Both paths through the action: an explicit version, and the empty default that
        # falls back to .nvmrc. The second is the one every caller uses, so it is the one
        # most likely to break unnoticed.
        include:
          - node: '22'
            explicit: true
          - node: ''
            explicit: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the action against the fixture
        id: setup
        uses: ./actions/setup
        with:
          node-version: ${{ matrix.node }}
          working-directory: fixtures/pnpm-repo
      - name: The action resolved the DECLARED package manager, not the runner's
        working-directory: fixtures/pnpm-repo
        shell: bash
        # This is the assertion the whole action exists for. theokit-sdk pinned pnpm 9.15.0
        # in four workflows while its manifest declared 10.34.1, and nothing failed — the
        # install simply resolved differently and every gate stayed green about a tree no
        # contributor had (usetheokit/theokit-sdk#415). An action that reads the manifest is
        # only worth having if something checks that it did.
        run: |
          set -euo pipefail
          declared="$(node -p "require('./package.json').packageManager.split('+')[0].split('@')[1]")"
          actual="$(pnpm --version)"
          echo "declared=${declared} actual=${actual}"
          test "${declared}" = "${actual}"

      - name: Node matches what was asked for
        # In the fixture directory, like the assertion above it: the `.nvmrc` the action reads
        # is the fixture's, and reading a different one would make this pass by accident on any
        # repository whose root happens to pin the same version.
        working-directory: fixtures/pnpm-repo
        shell: bash
        env:
          WANTED: ${{ matrix.node }}
        run: |
          set -euo pipefail
          actual="$(node --version)"
          expected="${WANTED:-$(cat .nvmrc)}"
          echo "wanted=${expected} actual=${actual}"
          case "${actual}" in "v${expected}"*) ;; *) echo "::error::node mismatch"; exit 1 ;; esac

      # The action writes NO npmrc, and that is the property worth holding still. `setup-node`
      # writes `_authToken=${NODE_AUTH_TOKEN}` whenever it is given a `registry-url`, and under
      # OIDC nobody exports NODE_AUTH_TOKEN — so the publish would run against a config naming a
      # credential that does not exist. Every release workflow in this ecosystem avoids that by
      # not passing the input; this asserts the action does not reintroduce it on their behalf.
      - name: No npmrc was written on the action's behalf
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "${NPM_CONFIG_USERCONFIG}" ] \
             && grep -q '_authToken' "${NPM_CONFIG_USERCONFIG}"; then
            echo "::error::the setup action produced an npmrc binding _authToken; under OIDC that names a credential nobody exports"
            cat "${NPM_CONFIG_USERCONFIG}"
            exit 1
          fi
          echo "no _authToken npmrc — an OIDC publish is not handed a phantom credential"

  npm-oidc-action:
    name: npm-oidc action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12'

      - name: The default lands inside the window
        uses: ./actions/npm-oidc

      - name: And it is the version the release workflows pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm --version)" = "11.9.0"

      # A guard is only a guard if something has watched it refuse. Both bounds are exercised
      # by running the same assertion against versions outside the window — in a subshell, so a
      # correct refusal does not fail this job.
      - name: It refuses npm 12 and anything below 11.5.1
        shell: bash
        run: |
          set -euo pipefail
          check() {
            actual="$1"
            major="${actual%%.*}"; rest="${actual#*.}"; minor="${rest%%.*}"; patch="${rest#*.}"
            [ "${major}" -ge 12 ] && return 1
            [ "${major}" -lt 11 ] && return 1
            if [ "${major}" -eq 11 ] && { [ "${minor}" -lt 5 ] || { [ "${minor}" -eq 5 ] && [ "${patch}" -lt 1 ]; }; }; then
              return 1
            fi
            return 0
          }
          for bad in 10.9.7 11.0.0 11.5.0 12.0.0 12.1.3; do
            if check "$bad"; then echo "::error::the guard ACCEPTED npm ${bad}"; exit 1; fi
            echo "refused ${bad} — correct"
          done
          for good in 11.5.1 11.9.0 11.99.0; do
            if ! check "$good"; then echo "::error::the guard REFUSED npm ${good}"; exit 1; fi
            echo "accepted ${good} — correct"
          done


  checks-pass-action:
    name: checks-pass action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Through the action, the way a caller uses it.
      - name: It accepts a set of successes
        uses: ./actions/checks-pass
        with:
          needs: '{"verify":{"result":"success"},"sonar":{"result":"success"}}'

      - name: It accepts a skip that was declared
        uses: ./actions/checks-pass
        with:
          needs: '{"verify":{"result":"success"},"optional":{"result":"skipped"}}'
          allowed-skips: optional

      # A guard is only a guard if something has watched it refuse. These run
      # `check.sh` directly — the same file the action runs, not a copy — in a
      # subshell, so a correct refusal does not fail this job.
      #
      # The empty-input case is not hypothetical. It PASSED while this was being
      # written: jq reads empty stdin as no documents and exits 0, so the type test
      # succeeded over nothing. A green light over nothing, inside the thing built to
      # refuse one.
      - name: It refuses everything it promises to refuse
        shell: bash
        run: |
          set -euo pipefail
          refuses() {
            if NEEDS="$1" ALLOWED_SKIPS="${2:-}" bash ./actions/checks-pass/check.sh >/dev/null 2>&1; then
              echo "::error::the guard ACCEPTED needs='$1' allowed-skips='${2:-}'"
              exit 1
            fi
            echo "refused needs='$1' allowed-skips='${2:-}' — correct"
          }
          refuses '{"a":{"result":"failure"}}'
          refuses '{"a":{"result":"cancelled"}}'
          refuses '{"a":{"result":"skipped"}}'
          refuses '{"a":{"result":"skipped"},"b":{"result":"skipped"}}' 'a'
          refuses '{"ab":{"result":"skipped"}}' 'a'
          refuses '{}'
          refuses '[]'
          refuses 'not-json'
          refuses ''
          refuses '   '

  manifest-check-action:
    name: manifest-check action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12'

      # Through the action, against this repository's own two packages.
      - name: It accepts this repository
        uses: ./actions/manifest-check

      # A guard is only a guard if something has watched it refuse. Each rule is fed a
      # manifest that breaks exactly that rule, in a subshell so a correct refusal does not
      # fail this job — and one case that must be ACCEPTED, because a check that refuses
      # everything is not a check either.
      - name: It refuses each defect, and accepts a bin-only package
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          write() { python3 -c "
          import json, sys
          base = json.load(open('base.json'))
          exec(sys.argv[1])
          json.dump(base, open(sys.argv[2] + '/package.json', 'w'))
          " "$1" "$dir"; }
          cat > base.json <<'JSON'
          { "name": "fixture", "description": "d", "license": "MIT", "files": ["dist"],
            "engines": { "node": ">=22.12.0" },
            "repository": { "type": "git", "url": "https://github.com/o/r" },
            "publishConfig": { "access": "public", "provenance": true },
            "bugs": { "url": "https://github.com/o/r/issues" },
            "homepage": "https://github.com/o/r#readme",
            "keywords": ["a"], "sideEffects": false,
            "exports": { ".": { "types": "./d.ts", "import": "./i.js" },
                         "./package.json": "./package.json" } }
          JSON
          refuses() {
            write "$1"
            if MANIFEST_ROOT="$dir" node ./actions/manifest-check/check.mjs >/dev/null 2>&1; then
              echo "::error::the guard ACCEPTED: $2"
              exit 1
            fi
            echo "refused $2 — correct"
          }
          accepts() {
            write "$1"
            if ! MANIFEST_ROOT="$dir" node ./actions/manifest-check/check.mjs >/dev/null 2>&1; then
              echo "::error::the guard REFUSED: $2"
              exit 1
            fi
            echo "accepted $2 — correct"
          }

          accepts "pass" "a complete manifest"
          refuses "del base['exports']['./package.json']" "no ./package.json export"
          refuses "base['exports']['.'] = {'import': './i.js', 'types': './d.ts'}" "types after import"
          refuses "del base['sideEffects']" "sideEffects undeclared"
          refuses "base['publishConfig']['provenance'] = False" "provenance off"
          refuses "base['repository'] = 'o/r'" "repository as a string"
          refuses "del base['keywords']" "no keywords"
          refuses "base['keywords'] = []" "empty keywords"
          refuses "del base['license']" "no license"
          refuses "del base['exports']" "no exports and not bin-only"
          accepts "base['bin'] = {'x': './x.js'}; base.pop('exports', None); base.pop('sideEffects', None)" "a bin-only CLI"

          # A run that finds nothing verified nothing, and must say so rather than pass.
          empty="$(mktemp -d)"
          if MANIFEST_ROOT="$empty" node ./actions/manifest-check/check.mjs >/dev/null 2>&1; then
            echo "::error::the guard ACCEPTED a directory with no publishable manifest"
            exit 1
          fi
          echo "refused an empty directory — correct"

  # `v1` is the ref every consumer resolves, and a change that does not reach it did not ship.
  #
  # The release moves it after a publish (release.yml), which covers a change that bumps the
  # package. It does NOT cover a change to the workflows themselves — the full-depth checkout, the
  # build step, the per-package floor runs all landed on `main` without a version bump, and each
  # one had to be pushed to `v1` by hand. Same class as #13: shipped, green, and not delivered.
  #
  # So `v1` follows `main`, with one condition.
  advance-v1:
    name: advance v1 to main
    needs: [test, setup-action, npm-oidc-action, checks-pass-action, manifest-check-action]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The pinned dep-check version must exist on the registry
        # The condition. A commit that bumps `dep-check-version` lands on `main` BEFORE the tag
        # that publishes it, so moving `v1` there would send every consumer to
        # `npx @theokit/dep-check@<unpublished>` — a failure at the point of use, worse than
        # lagging. When that is the case this job holds, and release.yml's `advance-v1` moves the
        # ref once the publish succeeds.
        id: check
        run: |
          set -euo pipefail
          pinned="$(awk '/^      dep-check-version:/{f=1} f&&/^        default:/{gsub(/[^0-9.]/,"",$2);print $2;exit}' .github/workflows/dep-check.yml)"
          if [ -z "$pinned" ]; then
            echo "::error::could not read dep-check-version default from .github/workflows/dep-check.yml"
            exit 1
          fi
          if npm view "@theokit/dep-check@$pinned" version >/dev/null 2>&1; then
            echo "move=true" >> "$GITHUB_OUTPUT"
            echo "registry serves $pinned — v1 can follow main"
          else
            echo "move=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$pinned is not published yet; leaving v1 where it is — the release will move it"
          fi

      - name: Move v1
        if: steps.check.outputs.move == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/v1" -f sha="$SHA" -F force=true >/dev/null
          echo "requested v1 -> $SHA"

      - name: v1 must actually point there
        if: steps.check.outputs.move == 'true'
        # For an ANNOTATED tag `.object.sha` is the sha of the tag OBJECT, not the commit — the ref
        # read f4f86f3 here while v1 resolved to 40514b8. Comparing that against github.sha fails
        # every time. Follow the indirection.
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          object_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/v1" --jq '.object.type')"
          object_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/v1" --jq '.object.sha')"
          if [ "$object_type" = "tag" ]; then
            actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" --jq '.object.sha')"
          else
            actual="$object_sha"
          fi
          echo "v1 -> $actual (ref holds a $object_type object)"
          if [ "$actual" != "$SHA" ]; then
            echo "::error::v1 resolves to $actual, expected $SHA"
            exit 1
          fi
