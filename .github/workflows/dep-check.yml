# Reusable dependency gate for the Theokit ecosystem — the blocking half.
#
#   jobs:
#     dep-check:
#       uses: usetheokit/shared-workflows/.github/workflows/dep-check.yml@v1
#
# Only the checks that are deterministic and offline block a push. The check that
# actually catches a range going stale — declared range vs the sibling's published
# `latest` — deliberately does NOT live here: it needs the registry, and a gate that
# turns red the day someone else cuts a major teaches a team to ignore red. That one
# runs once a day, organisation-wide, in dep-check-report.yml, and opens an issue.
#
# Every action is pinned to a commit SHA. A tag is a mutable pointer: whoever controls
# the action repository can move `v4` onto new code, and every workflow trusting that
# tag runs it on the next push with whatever secrets the job holds.
name: Dependency Gate

on:
  workflow_call:
    inputs:
      pnpm-version:
        description: 'pnpm version pinned through corepack. Must match the caller packageManager field.'
        type: string
        default: '10.34.1'
      node-version:
        type: string
        default: '22.12'
      dep-check-version:
        description: |
          The @theokit/dep-check version this gate runs. Pinned by default and on purpose: the
          workflow is referenced by a moving ref so a policy change reaches every caller, but the
          TOOL is a semver artifact, so a behaviour change is a version bump somebody reviewed.
          The pin lives here rather than in eleven callers.
        type: string
        default: '0.8.0'
      run-floor-check:
        description: |
          Also run the suite against the BOTTOM of every declared sibling range, not only
          the top. A wide range is a promise about an interval, and the devDependency only
          ever exercises one end of it. Off by default because it costs a second install.
        type: boolean
        default: false
      test-command:
        description: |
          The suite to run for the floor leg. Leave empty to derive it from the repository's
          lockfile — the default used to be the literal `pnpm test`, which produced
          `pnpm: command not found` (exit 127) on the one npm repository in the ecosystem,
          in a job whose name promised it had run the suite. Set it only when the script is
          not `test`.
        type: string
        default: ''
      run-install-check:
        description: |
          Also pack each publishable package and install it into an empty project with npm,
          asserting there is no ERESOLVE and exactly one copy of each ecosystem sibling.
          Costs a real npm install per package, so it is off for push and on for release.
        type: boolean
        default: false
      run-impact-check:
        description: |
          Also name the published consumers that this checkout's versions would strand.
          Meant for the release pull request: every other check lives in the consumer and
          therefore fires after the fact, while this one runs where the number is still
          a decision. Informational — it never fails the job.
        type: boolean
        default: false
      timeout-minutes:
        description: 'Without a ceiling, a wedged process holds the runner for the GitHub default of 6 hours.'
        type: number
        default: 15

permissions:
  contents: read

env:
  # Set once for every job. `${{ inputs.x }}` spliced into a run block is substituted before
  # bash parses the line, so a value carrying a shell metacharacter would run as code; reaching
  # the shell as an environment variable is what makes that impossible.
  DEP_CHECK_VERSION: ${{ inputs.dep-check-version }}

jobs:
  dep-check:
    name: dependency gate
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout the repository under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          # Nothing here pushes. Leaving the token in .git/config lets any later step
          # act as this repository.
          persist-credentials: false

      - name: Enable Corepack and pin pnpm
        # Skipped for a repository that does not use pnpm — theokit-skills is on npm, and
        # fetching a pnpm it will never invoke is a download and a lie in the log.
        if: ${{ hashFiles('repo/pnpm-lock.yaml') != '' }}
        # The version reaches the shell as an environment variable. `${{ inputs.x }}`
        # inside a run block is substituted before bash parses the line, so a value
        # carrying a shell metacharacter would run as code in this job.
        env:
          PNPM_VERSION: ${{ inputs.pnpm-version }}
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install the repository under test
        # The whole point of check A is comparing the declared range against what the
        # lockfile actually resolves, so the tree has to exist before it can be read.
        #
        # The command comes from the lockfile on disk rather than from `packageManager`,
        # because the two can disagree: theokit-skills declares pnpm, ships a
        # package-lock.json and runs `npm install` in its own CI. A hardcoded
        # `pnpm install --frozen-lockfile` fails there, and the failure reads like a
        # dependency problem instead of a wrong guess.
        run: |
          set -euo pipefail
          cmd=$(npx --yes "@theokit/dep-check@${DEP_CHECK_VERSION}" install-command --root repo)
          echo "detected: $cmd"
          cd repo && $cmd

      - name: A — declared range vs installed version
        run: npx --yes "@theokit/dep-check@${DEP_CHECK_VERSION}" manifest --root repo

      - name: D — install the tarball as a consumer would
        id: install-check
        if: ${{ inputs.run-install-check }}
        # Asks two questions, not one: does it install at all, and is there exactly one
        # copy of each sibling in the tree. The studio defect passed the first and failed
        # the second — npm installed two runtimes and hoisted the older one to the root.
        run: npx --yes "@theokit/dep-check@${DEP_CHECK_VERSION}" install --root repo

      - name: What this run actually checked
        # A job that reports `success` with its expensive leg SKIPPED is indistinguishable, from
        # outside, from a job that ran the leg and passed. Measured on theokit-sdk: step D had run
        # twice and failed twice, and every other run was green — because the leg never executed.
        # The red did not go away when the defect was fixed; it went away when the leg stopped
        # running, and the summary line said `success` throughout.
        #
        # This does not fail the job — skipping is the intended behaviour on an ordinary push, and a
        # gate that fails for doing what it was told teaches people to route around it. It makes the
        # skip legible instead, in the log and in the run summary, so "green" can be read as either
        # "checked and passed" or "did not check", which are different facts.
        if: always()
        env:
          RAN_INSTALL: ${{ steps.install-check.outcome }}
        run: |
          set -euo pipefail
          verdict() { [ "$1" = "skipped" ] && echo "NOT CHECKED (skipped)" || echo "$1"; }
          {
            echo "### Dependency gate — what ran"
            echo ""
            echo "| check | outcome |"
            echo "| --- | --- |"
            echo "| A · declared range vs installed version | success |"
            echo "| D · tarball installs as a consumer, one copy per sibling | $(verdict "${RAN_INSTALL:-skipped}") |"
            echo ""
            if [ "${RAN_INSTALL:-skipped}" = "skipped" ]; then
              echo "> The install leg is on for pull requests into \`main\` and for a \`full\` dispatch."
              echo "> This run did not pack or install anything — a green here means check A passed,"
              echo "> not that the published artefact was exercised."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${RAN_INSTALL:-skipped}" = "skipped" ]; then
            echo "::notice title=Install leg not run::Check A passed. The tarball install (D) was skipped on this event; green here is not evidence the artefact installs."
          fi

  floor:
    name: suite at the bottom of every declared range
    if: ${{ inputs.run-floor-check }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout the repository under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The suite runs here, and a suite can consult history. `theokit-tui`'s
          # never-weaken guard diffs against a base SHA; at depth 1 that SHA is not in the
          # clone and the test fails on `git diff`, not on a range. Its own CI checks out
          # at depth 0 for exactly this reason.
          fetch-depth: 0
          path: repo
          persist-credentials: false

      - name: Enable Corepack and pin pnpm
        if: ${{ hashFiles('repo/pnpm-lock.yaml') != '' }}
        env:
          PNPM_VERSION: ${{ inputs.pnpm-version }}
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install the repository under test
        # The command comes from the lockfile on disk rather than from `packageManager`,
        # because the two can disagree: theokit-skills declares pnpm, ships a
        # package-lock.json and runs `npm install` in its own CI. A hardcoded
        # `pnpm install --frozen-lockfile` fails there, and the failure reads like a
        # dependency problem instead of a wrong guess.
        run: |
          set -euo pipefail
          cmd=$(npx --yes "@theokit/dep-check@${DEP_CHECK_VERSION}" install-command --root repo)
          echo "detected: $cmd"
          cd repo && $cmd

      - name: Pin every sibling to the bottom of its declared range
        # Writes the overrides into the field this repository's package manager reads —
        # `pnpm.overrides` for pnpm, top-level `overrides` for npm, `resolutions` for
        # yarn. Writing to the wrong one is silently ignored, and then the reinstall
        # resolves the same versions, the suite passes, and the leg reports a floor it
        # never visited. That is why the choice lives in a tested module rather than here.
        run: npx --yes "@theokit/dep-check@${DEP_CHECK_VERSION}" pin-floors --root repo

      - name: Reinstall at the floor
        # Deliberately NOT frozen: pinning a floor IS a resolution change, and the whole
        # point of the leg is to resolve differently from the committed lockfile.
        run: |
          set -euo pipefail
          cmd=$(npx --yes "@theokit/dep-check@${DEP_CHECK_VERSION}" install-command --root repo --unlocked)
          echo "detected: $cmd"
          cd repo && $cmd

      - name: Build, if this repository has one
        # The leg reinstalls at the floor and then runs the suite. Without this step it ran
        # against a tree with no `dist/`, which no CI here produces: `theokit-tui` failed its
        # publish-contract test on `publint --strict`, and `theokit` reported `SKIP:
        # dist/index.js not found (run pnpm build first)` with TS2307s for subpaths that only
        # exist once built. Neither failure was about a range, and both read as one.
        #
        # A repository with no build script prints nothing here and the step is a no-op.
        run: |
          set -euo pipefail
          cmd=$(npx --yes "@theokit/dep-check@${DEP_CHECK_VERSION}" build-command --root repo)
          if [ -z "$cmd" ]; then
            echo "no build script in this repository — nothing to build"
            exit 0
          fi
          echo "detected: $cmd"
          cd repo && $cmd

      - name: Suite
        # zizmor: ignore[template-injection]
        #
        # This input IS code by contract — it is the suite the calling repository wants run
        # at the floor, and running it is the entire job. What bounds it is the trust model
        # of `workflow_call`: the value can only come from a workflow in a repository that
        # already chose to call this one, never from a pull request author. A caller that
        # can set this string can equally write the step itself.
        #
        # Empty means "derive it", which is the default: the manager comes from the lockfile
        # the same way the install and the overrides field do. Detecting it in two places out
        # of three is indistinguishable from not detecting it at all.
        env:
          CALLER_COMMAND: ${{ inputs.test-command }}
        run: |
          set -euo pipefail
          if [ -n "${CALLER_COMMAND}" ]; then
            cmd="${CALLER_COMMAND}"
          else
            cmd=$(npx --yes "@theokit/dep-check@${DEP_CHECK_VERSION}" run-command --root repo test)
          fi
          echo "suite: $cmd"
          cd repo && $cmd

  impact:
    name: consumers this release would strand
    if: ${{ inputs.run-impact-check }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout the repository under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Who breaks if this publishes
        # Reads the registry only — no install of the repository under test is needed,
        # because the question is about published consumers rather than this tree.
        #
        # Never fails the job. Leaving consumers behind is frequently the correct call;
        # what was missing was anyone knowing WHO, at a moment when it could still be
        # discussed. A gate that blocked here would just be routed around.
        run: |
          npx --yes "@theokit/dep-check@${DEP_CHECK_VERSION}" impact --root repo | tee impact.txt
          {
            echo "### Consumers this release would strand"
            echo ""
            echo '```'
            cat impact.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The floor leg writes ONE global override per sibling, so it can only pin a version every
  # declared range admits — the bottom of the intersection. Where ranges diverge, the lower floors
  # are never installed: `@theokit/sdk-pty` claims `>=4.4.1` while the leg tests `4.54.0`, and
  # nothing verifies the claim.
  #
  # That gap is not hypothetical. Four packages in theokit-sdk declared `>=4.0.0` and none of them
  # compiled against `4.0.1` (theokit-sdk#423) — live on the registry across ~54 releases of
  # claimed interval, invisible to the shared pin, and found only by installing per package.
  #
  # This job closes it: one run per (sibling, unexercised floor), each installing that floor and
  # running only the packages that declare it. Running the whole workspace at a floor one package
  # claims would fail packages whose own ranges exclude it — which is the defect #4 was.
  floor-plan:
    name: floors the shared pin cannot reach
    if: ${{ inputs.run-floor-check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Checkout the repository under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Plan the extra runs
        id: plan
        # Diagnostics go to stderr and the matrix to stdout, so this parses. An empty array is the
        # normal answer: most repositories declare one range per sibling and the intersection
        # reaches everything.
        run: |
          set -euo pipefail
          matrix="$(npx --yes "@theokit/dep-check@${DEP_CHECK_VERSION}" floor-matrix --root repo)"
          count="$(printf '%s' "$matrix" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).length))")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$count extra run(s) needed"

  floor-per-package:
    name: ${{ matrix.run.dep }}@${{ matrix.run.version }}, the floor only some packages claim
    needs: floor-plan
    if: ${{ needs.floor-plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      # Every unexercised floor is a separate claim. Stopping at the first failure would hide the
      # rest, and the point of this job is to find out which claims are false — not that one is.
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.floor-plan.outputs.matrix) }}
    steps:
      - name: Checkout the repository under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: repo
          persist-credentials: false

      - name: Enable Corepack and pin pnpm
        if: ${{ hashFiles('repo/pnpm-lock.yaml') != '' }}
        env:
          PNPM_VERSION: ${{ inputs.pnpm-version }}
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install the repository under test
        run: |
          set -euo pipefail
          cmd=$(npx --yes "@theokit/dep-check@${DEP_CHECK_VERSION}" install-command --root repo)
          echo "detected: $cmd"
          cd repo && $cmd

      - name: Pin only this floor
        env:
          DEP: ${{ matrix.run.dep }}
          VERSION: ${{ matrix.run.version }}
        run: npx --yes "@theokit/dep-check@${DEP_CHECK_VERSION}" pin-one --root repo "$DEP" "$VERSION"

      - name: Reinstall at that floor
        run: |
          set -euo pipefail
          cmd=$(npx --yes "@theokit/dep-check@${DEP_CHECK_VERSION}" install-command --root repo --unlocked)
          echo "detected: $cmd"
          cd repo && $cmd

      - name: Build, filtered to what claims this floor
        # NOT the whole workspace. Building everything at a floor only some packages claim fails
        # the packages whose own ranges exclude it — measured on theokit-sdk, where `pnpm build`
        # at `@theokit/sdk@4.4.1` failed on `sdk-cache`, which declares `>=4.54.0`. That is the
        # defect #4 was, reintroduced one level down. `--package` builds the claimant and its
        # workspace dependencies, and nothing else.
        env:
          PACKAGES: ${{ join(matrix.run.packages, ' ') }}
        run: |
          set -euo pipefail
          for pkg in $PACKAGES; do
            cmd=$(npx --yes "@theokit/dep-check@${DEP_CHECK_VERSION}" build-command --root repo --package "$pkg")
            if [ -z "$cmd" ]; then
              echo "no build script in this repository — nothing to build"
              exit 0
            fi
            echo "::group::build $pkg"
            echo "detected: $cmd"
            (cd repo && $cmd)
            echo "::endgroup::"
          done

      - name: Suite, for the packages that claim this floor
        env:
          PACKAGES: ${{ join(matrix.run.packages, ' ') }}
        run: |
          set -euo pipefail
          for pkg in $PACKAGES; do
            cmd=$(npx --yes "@theokit/dep-check@${DEP_CHECK_VERSION}" run-command --root repo --package "$pkg" test)
            echo "::group::$pkg"
            echo "suite: $cmd"
            (cd repo && $cmd)
            echo "::endgroup::"
          done

      - name: What this run actually checked
        if: always()
        env:
          DEP: ${{ matrix.run.dep }}
          VERSION: ${{ matrix.run.version }}
          RANGE: ${{ matrix.run.range }}
          PACKAGES: ${{ join(matrix.run.packages, ', ') }}
          SHARED: ${{ matrix.run.tested }}
        run: |
          {
            echo "### ${DEP}@${VERSION} — the floor the shared pin does not reach"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| declared range | \`${RANGE}\` |"
            echo "| floor exercised here | \`${VERSION}\` |"
            echo "| what the shared pin installs | \`${SHARED}\` |"
            echo "| packages run | ${PACKAGES} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # A stable check name for a job whose real names cannot be stable.
  #
  # `floor-per-package` names itself after its matrix entry, which is what makes a failure legible
  # — you see WHICH floor broke without opening anything. The cost is that the name changes with
  # the repository's declared ranges, so it can never be a required check, and when the matrix is
  # empty GitHub renders the uninterpolated expression in the UI.
  #
  # This job has one name, always reports, and fails if any matrix entry failed. It is the one to
  # mark required in branch protection.
  floor-per-package-result:
    name: floors the shared pin cannot reach — result
    needs: [floor-plan, floor-per-package]
    # `always()` so a skipped matrix still reports. A required check that does not report is
    # indistinguishable from one that passed, and blocks the pull request forever.
    if: always() && inputs.run-floor-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report what the extra runs found
        env:
          PLAN: ${{ needs.floor-plan.result }}
          RUNS: ${{ needs.floor-per-package.result }}
          COUNT: ${{ needs.floor-plan.outputs.count }}
        run: |
          set -euo pipefail
          echo "plan=$PLAN runs=$RUNS count=${COUNT:-0}"
          if [ "$PLAN" != "success" ]; then
            echo "::error::could not work out which floors need their own run"
            exit 1
          fi
          if [ "${COUNT:-0}" = "0" ]; then
            echo "every declared floor is reachable by the shared pin — no extra runs needed"
            echo "No declared floor is missed by the shared pin, so no extra runs were needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # `skipped` here means the matrix job never ran despite a non-zero count, which is a
          # gap, not a pass. Only `success` is a pass.
          if [ "$RUNS" != "success" ]; then
            echo "::error::$COUNT floor(s) needed their own run and the result was '$RUNS'"
            exit 1
          fi
          echo "$COUNT floor(s) exercised on their own"
