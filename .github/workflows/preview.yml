name: Preview releases

# Reusable per-commit package previews via pkg.pr.new, for the Theokit ecosystem.
#
#   jobs:
#     preview:
#       uses: usetheokit/shared-workflows/.github/workflows/preview.yml@v1 # zizmor: ignore[unpinned-uses]
#
# ## What it answers, and what it does not
#
# A fix in one repository is unverifiable from another until it is ON A REGISTRY: an example or a
# sibling package that resolves through a workspace tests the repository it lives in, not the
# experience of the person who typed `npm install`. This ecosystem has nine publishable
# repositories that depend on each other, so that gap is where its expensive defects live —
# measured 2026-08-31, `@theokit/http` reached 2.0.0 in one repository while three packages in
# another declared a range excluding it, and nothing found out until a release gate ran.
#
# Two mechanisms answer two different questions:
#
#   THIS workflow              a preview per commit, on pkg.pr.new's own registry, NEVER npm.
#                              Costs nothing, burns no version, exists for iteration.
#   actions/snapshot           a real npm publish under a non-`latest` dist-tag. Burns an
#                              immutable npm version, permanently. For when the answer has to
#                              come from registry.npmjs.org specifically.
#
# Reach for this one first.
#
# ## It is a reusable workflow, unlike actions/snapshot
#
# That difference is not stylistic. The snapshot publishes to npm, so it must run inside the
# caller's job for the OIDC token to be minted by `release.yml` and match the trusted-publisher
# connection. Nothing here talks to registry.npmjs.org, so there is no such constraint and the
# caller gets one `uses:` line instead of a job it has to assemble.
#
# Requires the `pkg-pr-new` GitHub App on the organisation — it is what posts the pull request
# comment. Without it the publish still runs and no comment appears, which reads as the tool being
# broken rather than uninstalled. Installed on usetheokit 2026-08-31.

on:
  workflow_call:
    inputs:
      build-command:
        description: >-
          Builds the packages. A preview must be installable, so this normally has to run. Pass an
          empty string for a repository that publishes its sources with no build step — skipping is
          then correct, not a shortcut.
        type: string
        default: 'pnpm run build'
      install-command:
        description: >-
          Override when the repository does not install with a frozen pnpm lockfile. Left empty the
          manager is detected from the lockfile, the shape `sonar.yml` already sets.
        type: string
        default: ''
      packages-command:
        description: >-
          Prints one publishable package directory per line. Leave empty to derive the list from
          the `private` flag across packages/* and apps/*. Pass a command when the repository
          already enumerates publishable packages for its release guards — a second definition of
          "publishable" is free to drift from the one the release path uses.
        type: string
        default: ''
      pkg-pr-new-version:
        description: >-
          Pinned so a preview cannot silently change tool version between commits. Ignored when
          `publish-command` is given.
        type: string
        default: '0.0.88'
      publish-command:
        description: >-
          Publishes the previews. `$DIRS` holds the derived package directories, space separated.
          Leave empty to run `pnpm dlx pkg-pr-new@<version>`. Pass `pnpm exec pkg-pr-new publish
          $DIRS` in a repository that carries the tool in its own lockfile — resolving it from
          there is the tool's own CI guidance, and it is stricter than a pinned dlx.
        type: string
        default: ''
      timeout-minutes:
        type: number
        default: 20

# pkg.pr.new authenticates as its own GitHub App and comments as itself. It needs nothing from
# GITHUB_TOKEN, so this job holds nothing.
permissions: {}

jobs:
  preview:
    name: Publish a preview of every publishable package
    # NOT on a back-merge. A pull request whose head is `main` carries content that is ALREADY
    # PUBLISHED, so there is nothing to preview — and it is opened by `github-actions[bot]`, whose
    # workflow runs GitHub holds for manual approval. Nobody approves them, so each one expires and
    # lands in the checks list as a failure: a red mark meaning "a preview nobody needed was not
    # produced". A check that is red on every back-merge is a check people stop reading, and being
    # read is the entire value of this one.
    #
    # `develop` is deliberately NOT excluded. A `develop → main` pull request is the RELEASE, and
    # its content is about to be published rather than already published — the one moment a preview
    # answers something. Those runs are opened by a person, need no approval, and pass today.
    #
    # `github.head_ref` is empty outside a pull request, so a push still previews.
    if: github.head_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, because the enumeration below scopes the preview to the packages the
          # commit touched and `git diff <base>...HEAD` needs a merge-base to exist. The default
          # depth is 1, and measured on `usetheokit/theokit#637` that is exactly what happened: the
          # step reported "could not read a diff (shallow clone)" and fell back to publishing all
          # seven — which reintroduces the cross-URL this scoping exists to avoid. A `git fetch
          # --depth=50` inside the step is not enough either; it deepens one ref without giving the
          # two histories a common ancestor.
          #
          # The cost is a full clone per preview run. That is the price of the scope being real
          # rather than a fallback that always fires, which is worse than not having it: it reads
          # as a mechanism and behaves as none.
          fetch-depth: 0
      # Which manager, decided by the lockfile on disk rather than assumed. Nine repositories
      # here use pnpm and one uses npm, and a workflow that assumed pnpm simply left that one
      # without previews — which is how a shared mechanism quietly becomes an eight-of-nine
      # mechanism.
      - name: Which package manager
        id: detect
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then echo "manager=pnpm" >> "$GITHUB_OUTPUT"
          else echo "manager=npm" >> "$GITHUB_OUTPUT"; fi

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: steps.detect.outputs.manager == 'pnpm'
        # No `version:` — the action reads `packageManager` from package.json, already the single
        # authority on the pnpm version.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: ${{ steps.detect.outputs.manager }}
          # Keyed on package.json as well as the lockfile, so a pnpm major bump cannot restore a
          # store the new pnpm reads as inconsistent.
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
          # NO `registry-url`: it writes an npmrc declaring a credential that does not exist here,
          # and nothing in this job talks to registry.npmjs.org.
      - name: Install
        env:
          OVERRIDE: ${{ inputs.install-command }}
        run: |
          set -euo pipefail
          if [ -n "${OVERRIDE}" ]; then eval "${OVERRIDE}"
          elif [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
          else npm ci
          fi

      # The full quality gate deliberately does NOT run here: CI grades this same commit in
      # parallel, and a preview that took six minutes would stop being reached for. Nothing
      # published here reaches anyone who did not paste its URL.
      - name: Build
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_COMMAND}" ]; then
            echo "no build step declared — publishing the sources as they are"
            exit 0
          fi
          eval "${BUILD_COMMAND}"

      - name: List the publishable packages
        env:
          PACKAGES_COMMAND: ${{ inputs.packages-command }}
          DEFAULT_BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # Written to a file rather than passed through argv. JavaScript inside shell inside YAML
          # is the quoting hazard that produced a real command-substitution bug in this ecosystem's
          # release workflow, and this script has to survive being read by whoever debugs it.
          cat > /tmp/list-publishable.mjs <<'NODE'
          import { execSync } from 'node:child_process'
          import { readdirSync, readFileSync, existsSync } from 'node:fs'
          import { join } from 'node:path'

          // Derived from the `private` flag, never from a glob. Handing pkg-pr-new a private
          // package is undocumented behaviour, and betting on it is how a preview starts
          // publishing something nobody meant to publish.
          const dirs = []
          for (const root of ['packages', 'apps']) {
            if (!existsSync(root)) continue
            for (const entry of readdirSync(root, { withFileTypes: true })) {
              if (!entry.isDirectory()) continue
              const manifest = join(root, entry.name, 'package.json')
              if (!existsSync(manifest)) continue
              const pkg = JSON.parse(readFileSync(manifest, 'utf8'))
              if (pkg.private === true || !pkg.name) continue
              dirs.push(`./${join(root, entry.name)}`)
            }
          }
          if (dirs.length === 0) {
            console.error('no publishable package found under packages/ or apps/ — the enumeration is wrong, not the repository')
            process.exit(1)
          }

          // Scoped to what this commit touched (#632, and #637 which did it first for one repo).
          //
          // pkg.pr.new rewrites internal dependencies to preview URLs across everything in ONE
          // invocation, so publishing all of them made each preview declare its siblings as URLs —
          // an exotic SUBdependency, which a default pnpm 11 refuses outright. Scoping keeps the
          // property that rewrite is FOR: a change inside one package publishes one, and its
          // siblings stay on registry ranges; a change spanning two publishes both, and the URL
          // between THEM survives, which is the case that needs it.
          //
          // FAILS WIDE, deliberately. No base ref, no git history, a shallow clone that cannot see
          // it, an empty diff — every one of those falls back to publishing everything, which is
          // exactly what this workflow did before. Failing narrow would silently stop previewing
          // the package somebody was about to verify, and a preview that is absent looks identical
          // to a preview that is broken.
          const base = process.env.PREVIEW_DIFF_BASE
          if (base) {
            let changed = ''
            let readable = true
            try {
              // stderr ignored: the failure is handled below, and git's `fatal:` line in the log
              // reads as a broken step to whoever opens it.
              changed = execSync(`git diff --name-only ${base}...HEAD`, {
                encoding: 'utf8',
                stdio: ['ignore', 'pipe', 'ignore'],
              })
            } catch {
              // A diff that could not be READ and a diff that is EMPTY both publish everything, and
              // they are different facts. Reporting them the same way is how a scope that never
              // runs looks identical to a scope that ran and matched nothing.
              readable = false
            }
            if (!readable) {
              console.error(`could not read a diff against ${base} — publishing every package`)
              for (const dir of dirs) console.log(dir)
              process.exit(0)
            }
            const touched = dirs.filter((dir) => {
              const prefix = `${dir.replace(/^\.\//, '')}/`
              return changed.split('\n').some((f) => f.startsWith(prefix))
            })
            if (touched.length > 0 && touched.length < dirs.length) {
              console.error(`scoped to ${touched.length} of ${dirs.length} package(s) this commit touched`)
              for (const dir of touched) console.log(dir)
              process.exit(0)
            }
            // Publishing everything brings the cross-package URL rewrite back with it, so this
            // preview is NOT installable under a default pnpm 11 — `blockExoticSubdeps` refuses a
            // sibling that arrives as a URL one level down. Said out loud, with the remedy, because
            // an uninstallable preview that announces itself costs a minute and one that does not
            // costs an afternoon (usetheokit/shared-workflows#48).
            //
            // Publishing NOTHING was the tempting alternative and it is wrong: `packages/*/
            // tsconfig.json` extends the repository root, so a root-level change alters what every
            // package BUILDS while touching no package directory. "No package in the diff" does not
            // mean "no package changed", and skipping there would hide a real difference.
            console.error(
              touched.length === 0
                ? 'no package directory in the diff — publishing every package'
                : 'every package is in the diff — publishing every package',
            )
            console.error(
              '::warning::this preview carries cross-package URLs, so a default pnpm 11 refuses it ' +
                '(ERR_PNPM_EXOTIC_SUBDEP). To install it, set `blockExoticSubdeps: false` in the ' +
                'consuming workspace — which stops vetting exotic subdependencies for that whole ' +
                'tree. A preview of a commit that touches one package does not need this.',
            )
          }

          for (const dir of dirs) console.log(dir)
          NODE

          if [ -n "$PACKAGES_COMMAND" ]; then
            eval "${PACKAGES_COMMAND}" > /tmp/publishable.txt
          else
            # The base ref the diff is taken against. `|| true` on purpose: the checkout above is
            # shallow, so the base may simply not be there — and the script falls back to publishing
            # everything, which is what this workflow did before #632. Failing wide keeps a preview
            # being produced; failing narrow silently stops previewing the package somebody was
            # about to verify.
            base_ref="${GITHUB_BASE_REF:-$DEFAULT_BASE_REF}"
            git fetch --quiet --depth=50 origin "$base_ref" 2>/dev/null || true
            PREVIEW_DIFF_BASE="origin/${base_ref}" node /tmp/list-publishable.mjs > /tmp/publishable.txt
          fi

          count=$(wc -l < /tmp/publishable.txt)
          echo "previewing ${count} package(s):"
          sed 's/^/  /' /tmp/publishable.txt

      - name: Publish a preview per publishable package
        env:
          PKG_PR_NEW_VERSION: ${{ inputs.pkg-pr-new-version }}
          PUBLISH_COMMAND: ${{ inputs.publish-command }}
        # ONE INVOCATION, SCOPED TO WHAT THE COMMIT TOUCHED.
        #
        # pkg.pr.new rewrites internal dependencies to preview URLs across every package in one
        # invocation. Publishing the whole workspace together therefore made each preview declare
        # its siblings as URLs — and from the consumer's side those are SUBdependencies, which
        # pnpm 11 refuses out of the box (`blockExoticSubdeps: true`):
        #
        #   [ERR_PNPM_EXOTIC_SUBDEP] Exotic dependency "@theokit/presenter" (resolved via url)
        #   is not allowed in subdependencies when blockExoticSubdeps is enabled
        #
        # Nothing in the consumer's manifest is exotic; the exotic package arrives one level down,
        # from the preview itself. `usetheokit/theokit#632`, `usetheokit/shared-workflows#44`.
        #
        # ## Why the fix is the LIST and not the loop
        #
        # This step published one package per invocation for a few hours, which removed the
        # cross-URL and also removed it where it is REQUIRED: a change spanning two packages needs
        # the URL between them, and an invocation per package cannot produce it.
        #
        # I had measured that a default pnpm 11 consumer cannot install a cross-package preview at
        # all — four setups, all refused, including the parent taken from the registry with a clean
        # range and only the sibling overridden — and read that as "the property costs nothing".
        # It does not follow. That measurement says the cross-URL does not help the DEFAULT
        # consumer; it says nothing about one who took the documented workaround
        # (`blockExoticSubdeps: false`) and still depends on it. Once the list is scoped, keeping
        # the property costs nothing either.
        #
        # So the scope moved into the enumeration above, where `usetheokit/theokit#637` had already
        # put it for one repository: a change inside one package publishes one, and its siblings
        # stay on registry ranges; a change spanning two publishes both, and the URL between THEM
        # survives. Repositories that pass their own `packages-command` keep deciding for
        # themselves — this only changes the default every other repository gets.
        run: |
          set -euo pipefail
          mapfile -t dirs < /tmp/publishable.txt
          if [ -n "$PUBLISH_COMMAND" ]; then
            # Through the environment and `eval`, the convention `sonar.yml` sets for
            # `coverage-command`. `$DIRS` is what the caller's command interpolates.
            DIRS="${dirs[*]}" eval "${PUBLISH_COMMAND}"
          else
            # Pinned rather than floating, so a preview cannot silently change tool version
            # between commits.
            if [ -f pnpm-lock.yaml ]; then
              pnpm dlx "pkg-pr-new@${PKG_PR_NEW_VERSION}" publish "${dirs[@]}"
            else
              npx --yes "pkg-pr-new@${PKG_PR_NEW_VERSION}" publish "${dirs[@]}"
            fi
          fi
