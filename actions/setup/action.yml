name: 'Setup the toolchain'
description: >-
  Checkout is the caller's; this is everything after it — Node, the package manager the repository
  declares, a cache keyed so it cannot outlive the manager that wrote it, and a frozen install.

# A COMPOSITE ACTION, not a reusable workflow, and the distinction is not cosmetic. A reusable
# workflow is a whole JOB: it runs on its own runner with its own filesystem, so a job that needed
# "setup, then my tests" would have to hand the tests to the reusable as a string input — the shape
# a shared workflow takes when it is asked to be everything. Setup is a sequence of STEPS inside
# somebody else's job, and a composite action is the only thing that is.
#
#   - uses: usetheokit/shared-workflows/actions/setup@v1
#     with:
#       node-version: '22.12'   # optional; defaults to .nvmrc

inputs:
  node-version:
    description: >-
      Explicit Node version. Leave empty to read `.nvmrc`, which is the default because it keeps the
      version in one place that contributors and CI both read. Pass it only for a matrix leg.
    required: false
    default: ''
  install:
    description: 'Run the frozen install. Set false for a job that only needs the toolchain.'
    required: false
    default: 'true'
  install-args:
    description: 'Extra arguments for the install, e.g. --ignore-scripts.'
    required: false
    default: ''
  working-directory:
    description: >-
      Where the project root is. A composite action does not inherit the caller's
      `defaults.run.working-directory`, so a repository whose manifest is not at the checkout root
      has to say so here — otherwise the install runs against nothing and reports success.
    required: false
    default: '.'
outputs:
  package-manager-version:
    description: 'The resolved package manager version, so a caller can assert on it.'
    value: ${{ steps.pm.outputs.version }}

runs:
  using: composite
  steps:
    - name: Node, before anything that needs an npm to exist
      # FIRST, and the order is the whole point of this step. `pnpm/action-setup` below installs
      # pnpm by writing a scratch package.json and shelling out to `npm ci` — with PATH set to the
      # job's PATH plus `dirname(process.execPath)`, the runner's own bundled node. Whichever npm
      # that resolution reaches is the one that installs pnpm, and nothing asserted anything about
      # it.
      #
      # On a hosted runner that npm works and the ordering never mattered. On usetheokit/website —
      # the one self-hosted runner among eleven consumers — the bundled node ships a `bin/npm` stub
      # with no `lib/cli.js` behind it, so the install died before the action had set anything up:
      #
      #   Error: Cannot find module '../lib/cli.js'
      #   requireStack: [ '/opt/actions-runner/externals.2.337.0/node24/bin/npm' ]
      #
      # CI there was red from 2026-09-02 to 2026-09-17 (usetheokit/website#24). An action named
      # "setup the toolchain" was requiring a toolchain to already be there.
      #
      # setup-node PREPENDS its own bin directory, so after this step `npm` resolves to one this
      # action installed rather than one it hoped to find.
      #
      # NO `cache:` here, deliberately — caching the pnpm store means running `pnpm store path`,
      # and pnpm does not exist yet at this point. The cache stays on the second call below, which
      # is why there are two.
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && format('{0}/.nvmrc', inputs.working-directory) || '' }}
        # DELIBERATELY NO `registry-url`. The second call carries the full reason; it applies here
        # identically, and a reader who changes one must change both.

    - name: Install the package manager the repository declares
      # NO `version:` input, deliberately. pnpm/action-setup reads `packageManager` from
      # package.json when none is given, so the version lives in exactly one place. Passing it here
      # creates a second place to update and therefore a place to forget: theokit-sdk pinned
      # `corepack prepare pnpm@9.15.0` in four workflows while its manifest said 10.34.1, so every
      # gate there validated under a package manager no contributor used (usetheokit/theokit-sdk#415).
      #
      # `standalone: true` looks like the fix for the npm problem described above and is NOT. Read
      # at the pinned SHA: it selects `@pnpm/exe` over `pnpm` in the scratch lockfile, and both
      # paths run the same `npm ci`. What this needs is a working npm, which the step above now
      # guarantees rather than hopes for.
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        # WHICH manifest, not which version. Without this the action reads `packageManager`
        # from the checkout root and fails with "No pnpm version is specified" the moment the
        # project lives in a subdirectory — measured, on the fixture in this repository.
        package_json_file: ${{ inputs.working-directory }}/package.json

    - name: Setup Node
      # The SECOND call to setup-node, and it is here for the CACHE rather than for Node. setup-node
      # owns the pnpm-store cache, and wiring that requires pnpm on PATH — so it cannot be the call
      # that precedes pnpm. Two calls is the cheapest way to have both: this one resolves the same
      # version from the same source, hits the tool cache, and adds the store.
      #
      # DO NOT collapse them back into one. The single call was the bug (usetheokit/website#24), and
      # `setup-action when the npm in scope is broken` in this repository's CI fails if it returns.
      #
      # The alternative was an `actions/cache` step with a hand-written key, which would mean
      # re-deriving the rule below by hand, in a second place, where it can drift from its reason.
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && format('{0}/.nvmrc', inputs.working-directory) || '' }}
        # DELIBERATELY NO `registry-url`, and this is load-bearing rather than an omission.
        # `setup-node` writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into an npmrc
        # UNCONDITIONALLY and points `NPM_CONFIG_USERCONFIG` at it, then exports NODE_AUTH_TOKEN
        # only if the caller supplied one — which, under OIDC trusted publishing, nobody does. The
        # job would publish with a config declaring a credential that does not exist.
        #
        # Measured 2026-09-05: all nine `release.yml` in this ecosystem publish through
        # `actions/npm-oidc`, and ZERO pass `registry-url`. Seven carry a comment saying why not.
        # A passthrough was briefly added here (#54) on the strength of a grep that counted those
        # comments as uses; it served nobody and its documentation invited the harmful setting, so
        # it was removed. If a non-OIDC consumer ever needs it, add it back WITH this warning.
        cache: pnpm
        # The cache key must change when the package manager does. setup-node keys the pnpm store on
        # the lockfile alone, so a pnpm 9 -> 10 bump leaves the key identical and the job restores a
        # store the new pnpm reads as inconsistent — `ERR_PNPM_MISSING_PACKAGE_INDEX_FILE`, on a
        # package the lockfile does list. package.json carries `packageManager`, so including it
        # ties the cache to the pnpm that wrote it.
        cache-dependency-path: |
          ${{ inputs.working-directory }}/pnpm-lock.yaml
          ${{ inputs.working-directory }}/package.json

    - name: Record the resolved package manager
      id: pm
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # Printed and exported rather than assumed. When CI and a contributor disagree about the
      # package manager, nothing errors — the install simply resolves differently, and the run stays
      # green about a tree nobody has. One line in the log is what makes that visible.
      run: |
        set -euo pipefail
        version="$(pnpm --version)"
        declared="$(node -p "require('./package.json').packageManager ?? 'not declared'")"
        echo "pnpm ${version} · package.json declares ${declared}"
        echo "version=${version}" >> "$GITHUB_OUTPUT"

    - name: Install (frozen lockfile)
      if: ${{ inputs.install == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        EXTRA_ARGS: ${{ inputs.install-args }}
      # Frozen: CI installs what the lockfile says or fails. A non-frozen install in CI resolves
      # something the committed lockfile does not describe, and then the suite passes about that.
      #
      # NO `PNPM_CONFIG_TRUST_LOCKFILE`, and that is a measurement rather than an omission.
      #
      # vitest-dev/vitest sets it repo-wide (`ci.yml:23-26`) and documents ~15-20s saved per job by
      # skipping pnpm's per-install supply-chain verification. Measured here on theokit-sdk,
      # pnpm 10.34.1, two runs each against a warm store:
      #
      #   default (verification on)   2.78s, 2.54s
      #   TRUST_LOCKFILE=true         2.52s, 2.54s
      #
      # Nothing. Their saving is real and ours is not — most plausibly because their number comes
      # from a colder store with more packages to verify, and every job here restores a warm one
      # through the `cache: pnpm` above.
      #
      # Recorded rather than left silent so nobody re-derives it from the same blog-shaped
      # intuition: this trades a supply-chain check for zero measured seconds. Worth re-testing if
      # the cache stops hitting, and only against a measurement.
      run: pnpm install --frozen-lockfile ${EXTRA_ARGS}
